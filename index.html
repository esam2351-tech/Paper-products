<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مخزن الورقيات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f5c4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الورقيات">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--pri:#0f5c4d;--pri2:#13806a;--acc:#e0a526;--bg:#f3f5f4;--card:#fff;--txt:#1d2a27;--mut:#6b7c77;--bd:#e1e7e5;--red:#c0392b;--grn:#1e8e4f;--soft:#e7f2ef}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:Cairo,'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
button{font-family:inherit}
/* الهيكل: شريط علوي + محاور كبيرة على الجنب */
header{position:sticky;top:0;z-index:30;padding-top:max(10px,env(safe-area-inset-top))!important;background:var(--pri);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px}
header h1{font-size:18px;white-space:nowrap}
.gs{flex:1;max-width:460px;position:relative}
.gs input{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:9px 16px}
.gs input::placeholder{color:#bfd9d2}
.gsr{position:absolute;top:44px;right:0;left:0;background:#fff;color:var(--txt);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;max-height:340px;overflow:auto}
.gsr div{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd)}.gsr div:hover{background:var(--soft)}
.hico{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px}
.wrap{display:flex}
.hubs{width:96px;background:#fff;border-left:1px solid var(--bd);position:sticky;top:56px;height:calc(100vh - 56px);display:flex;flex-direction:column;gap:6px;padding:10px 8px}
.hub{border:0;background:none;border-radius:14px;padding:10px 4px;cursor:pointer;color:var(--mut);font-weight:700;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.hub i{font-style:normal;font-size:24px}
.hub.on{background:var(--soft);color:var(--pri)}
main{flex:1;min-width:0;padding:18px}
/* عناصر عامة */
.btn{background:var(--pri2);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn.sec{background:#e8eeec;color:var(--txt)}.btn.red{background:var(--red)}.btn.acc{background:var(--acc);color:#1d2a27}
.btn.sm{padding:5px 10px;font-size:12.5px}.btn.big{padding:13px;font-size:16px;width:100%}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;width:100%;background:#fff}
input:focus,select:focus{outline:2px solid var(--pri2);border-color:transparent}
label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:4px;font-weight:700}
.panel{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:13px;color:var(--mut)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{color:var(--mut);font-size:12.5px;background:#f7faf9}
.tw{overflow-x:auto}
.pos{color:var(--grn);font-weight:800}.neg{color:var(--red);font-weight:800}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.tag.r{background:#fde8e6;color:var(--red)}.tag.g{background:#e3f5ea;color:var(--grn)}.tag.y{background:#fdf3dc;color:#9a6b00}
.empty{text-align:center;color:var(--mut);padding:26px}
.ttl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ttl h2{font-size:21px}
/* ===== الكاشير ===== */
.pos-wrap{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;cursor:pointer;position:relative;transition:.12s;user-select:none}
.tile:hover{border-color:var(--pri2);transform:translateY(-2px)}
.tile b{display:block;font-size:14px;line-height:1.4;min-height:40px}
.tile .pr{color:var(--pri);font-weight:800;font-size:17px;margin-top:6px}
.tile .st{font-size:12px;color:var(--mut)}
.tile .cnt{position:absolute;top:-8px;left:-8px;background:var(--acc);color:#1d2a27;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:13px}
.tile.out{opacity:.55}
.bar{height:5px;background:#edf1f0;border-radius:9px;margin-top:6px;overflow:hidden}.bar span{display:block;height:100%;background:var(--grn)}
.cart{position:sticky;top:74px}
.cust-pick{background:var(--soft);border-radius:12px;padding:10px;margin-bottom:10px}
.cust-pick small{display:block;margin-top:4px;color:var(--mut)}
.cl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.cl .nm{flex:1;min-width:0}.cl .nm b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:26px;height:26px;border:0;border-radius:8px;background:#e8eeec;cursor:pointer;font-weight:800}
.qty input{width:48px;text-align:center;padding:4px}
.cl .pi{width:70px;padding:4px}
.sum{margin-top:10px;font-size:14px}.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .big{font-size:20px;font-weight:800;color:var(--pri);border-top:2px solid var(--bd);padding-top:8px;margin-top:4px}
.cart-toggle{display:none}
/* ===== العملاء ===== */
.cw{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.clist{max-height:calc(100vh - 150px);overflow:auto;padding:8px}
.ci{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:12px;cursor:pointer;gap:8px}
.ci:hover{background:#f7faf9}.ci.on{background:var(--soft)}
.ci .av{width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.ci .tx{flex:1;min-width:0}.ci .tx b{display:block;font-size:14px}.ci .tx small{color:var(--mut)}
.prof-h{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.prof-h h2{font-size:22px}.prof-h small{color:#cfe6e0}
.prof-h .bal{text-align:left}.prof-h .bal b{font-size:30px;display:block}
.prof-h .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prof-h .acts .btn{background:rgba(255,255,255,.16)}.prof-h .acts .btn.acc{background:var(--acc)}
.tabs{display:flex;gap:4px;margin:14px 0 12px;border-bottom:2px solid var(--bd);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--acc)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px}
.kp small{color:var(--mut);font-weight:700;font-size:12px}.kp b{display:block;font-size:20px;margin-top:2px}
.tl{position:relative;padding-right:18px}
.tl:before{content:"";position:absolute;right:6px;top:4px;bottom:4px;width:2px;background:var(--bd)}
.ev{position:relative;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ev:before{content:"";position:absolute;right:-17px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--pri2));border:2px solid #fff;box-shadow:0 0 0 2px var(--c,var(--pri2))}
.ev small{color:var(--mut)}
.dayh{font-weight:800;color:var(--mut);margin:14px 0 8px;font-size:13px}
/* ===== المخزن ===== */
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sc{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;cursor:pointer}
.sc:hover{border-color:var(--pri2)}
.sc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.cw>*,.pos-wrap>*{min-width:0}.prof-h>div{min-width:0}
.sc .num{font-size:28px;font-weight:800;margin-top:8px}.sc .num small{font-size:13px;color:var(--mut);font-weight:600}
.sc .bar{height:8px}
.sc .meta{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;margin-top:8px}
/* نوافذ */
.ov{position:fixed;inset:0;background:rgba(10,30,25,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;overflow-y:auto;padding:30px 12px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:820px;padding:20px}
.modal h3{margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.lines td{padding:5px}.lines input,.lines select{padding:6px}
.tot{background:#f7faf9;border-radius:10px;padding:12px;margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 20px;border-radius:999px;display:none;z-index:99}
.cashpill{background:var(--acc);border:0;color:#1d2a27;border-radius:999px;padding:7px 14px;font-weight:800;cursor:pointer;white-space:nowrap;font-size:14px}
.cashbig{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.cashbig small{display:block;color:#cfe6e0;font-weight:700}.cashbig b{font-size:34px;font-weight:800}.cashbig .hand{text-align:left}.cashbig .hand b{font-size:20px;color:#ffd979}
.sc.sel{border:2px solid var(--pri2);background:var(--soft)}
.rtag{display:inline-block;background:#fdf3dc;color:#9a6b00;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;margin-right:4px}
.cpk{position:relative}.cpk input{padding-left:36px}
.cpl{position:absolute;top:100%;right:0;left:0;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.16);max-height:300px;overflow:auto;z-index:70;display:none;margin-top:4px}
.cpo{padding:9px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;border-bottom:1px solid #f0f3f2;font-size:14px}.cpo small{margin-right:auto;color:var(--mut);white-space:nowrap}
.cpo:hover,.cpo.on{background:var(--soft)}.cpo.new{color:var(--pri);font-weight:700}
.cpx{position:absolute;left:7px;top:50%;transform:translateY(-50%);border:0;background:#e8eeec;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:12px;line-height:24px;padding:0}
mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 1px}
.rinfo{background:#fdf3dc;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.7}
.gate{position:fixed;inset:0;background:linear-gradient(135deg,#0f5c4d,#13806a);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.gate .in{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.gate h2{margin-bottom:6px}.gate .hint{color:var(--mut);font-size:13.5px;margin-bottom:14px;line-height:1.7}.gate input,.gate textarea{margin-bottom:10px}
.net{width:11px;height:11px;border-radius:50%;background:#9fb;flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.15)}.net.on{background:#3ecf8e}.net.pend{background:#ffd34d}.net.off{background:#ff6b5b}
.chk{display:flex;flex-wrap:wrap;gap:8px 18px}.chk label{display:flex;align-items:center;gap:6px;color:var(--txt);font-size:14px;margin:0;font-weight:600}.chk input{width:auto}
.hint{color:var(--mut);font-size:12.5px}
/* موبايل */
@media(max-width:900px){
 header{padding:8px 12px;gap:8px}header h1{font-size:15px}
 .hubs{position:fixed;top:auto;bottom:0;right:0;left:0;width:auto;height:64px;flex-direction:row;justify-content:space-around;border:0;border-top:1px solid var(--bd);padding:4px;z-index:40}
 .hub{flex:1;padding:4px 2px;font-size:10.5px}.hub i{font-size:19px}
 .cashpill{padding:6px 10px;font-size:12.5px}.gs{min-width:0}.hico{padding:7px 9px;font-size:15px}header h1{display:none}
 main{padding:12px 12px 140px}
 .pos-wrap,.cw{grid-template-columns:1fr}
 .tiles{grid-template-columns:repeat(2,1fr)}
 .cart{position:fixed;bottom:64px;right:0;left:0;top:auto;z-index:35;border-radius:18px 18px 0 0;max-height:75vh;overflow:auto;transform:translateY(calc(100% - 0px));transition:.25s;display:none}
 .cart.open{display:block;transform:none}
 .cart-toggle{display:flex;position:fixed;bottom:72px;right:12px;left:12px;z-index:36;background:var(--acc);border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;justify-content:space-between;box-shadow:0 6px 18px rgba(0,0,0,.2)}
 .cart.open~.cart-toggle{display:none}
 .clist{max-height:none}
 .cw.has .clistw{display:none}.cw:not(.has) .profw{display:none}
 .backc{display:inline-block!important}
}
.backc{display:none}
@media print{header,.hubs,.noprint{display:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="in"><h2>⏳ جاري التحميل...</h2></div></div>
<header>
  <h1 id="sName">مخزن الورقيات</h1>
  <div class="gs"><input id="gq" placeholder="🔍 ابحث عن عميل أو صنف..." oninput="gSearch()" onblur="setTimeout(()=>gsr.style.display='none',200)"><div class="gsr" id="gsr"></div></div>
  <button class="cashpill" id="cashPill" title="الخزينة" onclick="go('cash')"></button>
  <span class="net" id="net"></span>
  <button class="hico" id="gearB" title="الإعدادات" onclick="go('settings')">⚙️</button>
  <button class="hico" id="instB" title="تثبيت البرنامج" onclick="doInstall()" style="display:none">📲</button>
  <button class="hico" title="حسابي" onclick="acctMenu()">👤</button>
</header>
<div class="wrap">
  <nav class="hubs" id="hubs"></nav>
  <main id="page"></main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// ============ البيانات (نفس قاعدة بيانات النسخة الأولى) ============
const KEY='warqiyat_db_v1';
const blank={settings:{name:'مخزن الورقيات',phone:'',address:'',cats:['مناديل','رول مطبخ','ورق تواليت','كوبايات ورق','أطباق ورق','فوط','أكياس','أخرى'],units:['كرتونة','بالة','دستة','باكو','قطعة']},items:[],customers:[],suppliers:[],sales:[],purchases:[],payments:[],expenses:[],reps:[],boxes:[{id:'box1',name:'الخزنة الرئيسية',opening:0}],cash:[],deps:[],seq:{sale:1,pur:1}};
let db;
function fixDb(d){d=d&&typeof d==='object'?d:{};for(const k in blank)if(d[k]===undefined)d[k]=structuredClone(blank[k]);
  if(!d.boxes.length)d.boxes.push({id:'box1',name:'الخزنة الرئيسية',opening:0});const b0=d.boxes[0].id;
  d.sales.forEach(s=>{if(s.boxId===undefined)s.boxId=s.repId?'':b0});d.purchases.forEach(p=>{if(!p.boxId)p.boxId=b0});
  d.payments.forEach(p=>{if(p.boxId===undefined)p.boxId=b0});d.expenses.forEach(e=>{if(!e.boxId)e.boxId=b0});return d}
db=fixDb(null);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const n=v=>Number(v)||0;
const f=v=>n(v).toLocaleString('ar-EG',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=(arr,id)=>db[arr].find(x=>x.id===id);
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
const openM=h=>{$('modal').innerHTML=h;$('ov').classList.add('on')};
const closeM=()=>$('ov').classList.remove('on');
$('ov').onclick=e=>{if(e.target.id==='ov')closeM()};

// ============ الحسابات ============
function stock(itemId){const it=byId('items',itemId);let s=n(it?.opening);
  db.purchases.forEach(p=>p.lines.forEach(l=>{if(l.itemId===itemId)s+=n(l.qty)}));
  db.sales.forEach(p=>p.lines.forEach(l=>{if(l.itemId===itemId)s-=n(l.qty)}));return s}
const subTotal=d=>d.lines.reduce((a,l)=>a+n(l.qty)*n(l.price),0);
const discVal=d=>d.discType==='%'?subTotal(d)*n(d.discount)/100:n(d.discount);
const netTotal=d=>subTotal(d)-discVal(d);
function custBal(id){const c=byId('customers',id);let b=n(c?.opening);
  db.sales.filter(s=>s.partyId===id).forEach(s=>b+=netTotal(s)-n(s.paid));
  db.payments.filter(p=>p.type==='in'&&p.partyId===id).forEach(p=>b-=n(p.amount));return b}
function supBal(id){const c=byId('suppliers',id);let b=n(c?.opening);
  db.purchases.filter(s=>s.partyId===id).forEach(s=>b+=netTotal(s)-n(s.paid));
  db.payments.filter(p=>p.type==='out'&&p.partyId===id).forEach(p=>b-=n(p.amount));return b}
const saleProfit=s=>s.lines.reduce((a,l)=>a+(n(l.price)-n(l.cost))*n(l.qty),0)-discVal(s);
const inRange=(d,a,b)=>(!a||d>=a)&&(!b||d<=b);
const PCSS=`body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;padding:24px;color:#1d2a27}.hd{background:#0f5c4d;color:#fff;border-radius:14px;padding:16px 20px;display:flex;justify-content:space-between;-webkit-print-color-adjust:exact;print-color-adjust:exact}.bx{border:1px solid #dfe6e4;border-radius:12px;padding:12px;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e3e9e7;text-align:right}th{background:#f3f7f6}.sep{border-top:2px dashed #e0a526;margin:14px 0}.r{display:flex;justify-content:space-between;padding:4px 0}.big{font-size:18px;font-weight:700}`;
const dayName=d=>{if(d===today())return'النهارده';const y=shiftDay(today(),-1);if(d===y)return'امبارح';return new Date(d).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})};

// ================= أسماء ومساعدات =================
const cName=id=>byId('customers',id)?.name||'عميل نقدي';
const sName=id=>byId('suppliers',id)?.name||'';
const rName=id=>byId('reps',id)?.name||'';
const bName=id=>byId('boxes',id)?.name||'';
const repOf=cid=>{const r=byId('customers',cid)?.repId;return r&&byId('reps',r)?r:''};
const boxOpts=sel=>db.boxes.map(b=>`<option value="${b.id}" ${b.id===sel?'selected':''}>${esc(b.name)}</option>`).join('');
function custOpts(sel,cashLabel){
  const mr=myRep();if(mr){const o=x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`;return(cashLabel?`<option value="">${cashLabel}</option>`:'')+db.customers.filter(c=>repOf(c.id)===mr).map(o).join('')}
  const D=db.customers.filter(c=>!repOf(c.id));let h=cashLabel?`<option value="">${cashLabel}</option>`:'';
  const o=x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`;

  return M.sort((x,y)=>x.d.localeCompare(y.d))}

const AUTHERR=e=>({'auth/invalid-credential':'الإيميل أو كلمة السر غلط','auth/wrong-password':'كلمة السر غلط','auth/user-not-found':'الإيميل ده مش متسجل','auth/invalid-email':'الإيميل مش مظبوط','auth/email-already-in-use':'الإيميل ده متسجل قبل كده','auth/weak-password':'كلمة السر ضعيفة (6 حروف على الأقل)','auth/too-many-requests':'محاولات كتير — استنى شوية وجرب تاني','auth/network-request-failed':'مفيش نت','auth/operation-not-allowed':'لازم تفعّل الدخول بالإيميل والباسورد من Firebase ← Authentication'}[e.code]||e.message);

// ---------- المزامنة ----------
function stopSync(){unsubs.forEach(u=>u());unsubs=[];loaded=new Set();pend={};resetSynced();db=fixDb(null)}
function startSync(){
  db=fixDb(null);resetSynced();
  unsubs.push(fdb.collection('users').doc(me.uid).onSnapshot(d=>{if(!d.exists||d.data().active===false){auth.signOut();return}const o=me.role;me={uid:me.uid,...d.data()};if(ready&&o!==me.role)location.reload();else if(ready)scheduleRender()}));
  if(isAdmin())unsubs.push(fdb.collection('users').onSnapshot(s=>{users=s.docs.map(d=>({uid:d.id,...d.data()}));if(ready&&cur==='settings')scheduleRender()}));
  COLLS.forEach(c=>unsubs.push(fdb.collection(c).onSnapshot({includeMetadataChanges:true},snap=>{
    snap.docChanges().forEach(ch=>{const id=ch.doc.id;
      if(ch.type==='removed'){db[c]=db[c].filter(x=>x.id!==id);delete synced[c][id];return}
      const d=ch.doc.data();d.id=id;const i=db[c].findIndex(x=>x.id===id);if(i>=0)db[c][i]=d;else db[c].push(d);synced[c][id]=JSON.stringify(d)});
    pend[c]=snap.metadata.hasPendingWrites;loaded.add(c);onData()},e=>fbErr(e))));
  unsubs.push(fdb.collection('app').onSnapshot({includeMetadataChanges:true},snap=>{
    snap.docs.forEach(d=>{const k=d.id,v=d.data();if(k==='settings'){db.settings={...db.settings,...v}}if(k==='seq'){for(const x in v)db.seq[x]=Math.max(n(db.seq[x]),n(v[x]))}synced.app[k]=JSON.stringify(k==='settings'?db.settings:db.seq)});
    pend.app=snap.metadata.hasPendingWrites;loaded.add('app');onData()},e=>fbErr(e)));
}
function fbErr(e){if(e.code==='permission-denied')toast('⛔ مفيش صلاحية — اتأكد من قواعد الحماية (Rules) في Firebase');else console.error(e)}
function onData(){
  netStatus();
  if(!ready){if(loaded.size<COLLS.length+1)return;ready=true;db=fixDb(db);
    if(!synced.boxes[db.boxes[0].id]&&!isRO())save();   // أول مرة: إنشاء الخزنة الرئيسية
    if(!can(cur))cur=Object.keys(HUBS).find(can)||'cust';hideGate();render();offerImport();return}
  db=fixDb(db);scheduleRender();
}
let rT=null;
function scheduleRender(){clearTimeout(rT);rT=setTimeout(()=>{const a=document.activeElement;
  if(a&&$('page').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return scheduleRender();render()},350)}
function nextNo(k,arr){const m=Math.max(0,...db[arr].map(x=>n(x.no)));const v=Math.max(n(db.seq[k]),m+1);db.seq[k]=v+1;return v}

// الحفظ: بيقارن البيانات باللي على السيرفر ويبعت التغييرات بس
const save=()=>{
  if(!me||!ready)return;
  if(isRO()){toast('👁️ حساب متابع فقط — مش مسموح بالتعديل');return}
  const ops=[];
  COLLS.forEach(c=>{const seen=new Set();db[c].forEach(o=>{if(!o.id)o.id=uid();seen.add(o.id);const j=JSON.stringify(o);if(synced[c][o.id]!==j){synced[c][o.id]=j;ops.push([c,o.id,JSON.parse(j)])}});
    Object.keys(synced[c]).forEach(id=>{if(!seen.has(id)){delete synced[c][id];ops.push([c,id,null])}})});
  ['settings','seq'].forEach(k=>{const j=JSON.stringify(db[k]);if(synced.app[k]!==j){synced.app[k]=j;ops.push(['app',k,JSON.parse(j)])}});
  for(let i=0;i<ops.length;i+=400){const b=fdb.batch();ops.slice(i,i+400).forEach(([c,id,d])=>{const r=fdb.collection(c).doc(id);d?b.set(r,d):b.delete(r)});
    b.commit().catch(e=>{fbErr(e);if(e.code==='permission-denied')setTimeout(()=>location.reload(),1500)})}
  netStatus();

function saveCart(print){
  const c=cart;c.lines=c.lines.filter(l=>n(l.qty)>0);

  const old=c.editId?byId('sales',c.editId):null;
  const short=[...new Set(c.lines.map(l=>l.itemId))].filter(k=>{let av=stock(k);if(old)old.lines.forEach(l=>{if(l.itemId===k)av+=n(l.qty)});return inCart(k)>av});

  <div class="bx">المندوب: <b>${esc(r.name)}</b> ${r.phone?'— '+esc(r.phone):''}</div><div class="bx">${stmtHTML(repRows(id),r.opening,'عليه','ورّد')}</div>

  ${C.length?`<div class="bx"><b>أرصدة عملائه</b><table style="margin-top:8px"><tr><th>العميل</th><th>عليه</th></tr>${C.map(x=>`<tr><td>${esc(x.c.name)}</td><td>${f(x.b)}</td></tr>`).join('')}</table></div>`:''}<script>setTimeout(()=>print(),400)<\/script></body></html>`);w.document.close()}

// ================= الخزينة =================
let cashD=today(),cashB='';
V.cash=()=>{
  const tot=cashTotal(),hand=db.reps.reduce((a,r)=>a+repHand(r.id),0);
  const B=cashB&&byId('boxes',cashB)?[byId('boxes',cashB)]:db.boxes,all=!cashB;
  const M=B.flatMap(b=>boxMoves(b.id).map(m=>({...m,box:b.id}))).filter(m=>!(all&&m.tr));
  const open=B.reduce((a,b)=>a+n(b.opening),0)+M.filter(m=>m.d<cashD).reduce((a,m)=>a+m.a-m.b,0);
  const Dm=M.filter(m=>m.d===cashD),inn=Dm.reduce((a,m)=>a+m.a,0),out=Dm.reduce((a,m)=>a+m.b,0);
  $('page').innerHTML=`<div class="ttl"><h2>🏦 الخزينة</h2><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="cashForm('in')">➕ إيداع</button><button class="btn sec" onclick="cashForm('out')">➖ سحب</button>${db.boxes.length>1?`<button class="btn sec" onclick="cashForm('tr')">🔁 تحويل</button>`:''}<button class="btn acc" onclick="depForm()">🤝 توريد مندوب</button><button class="btn red" onclick="expForm()">📤 مصروف</button><button class="btn sec" onclick="payForm('out')">💸 سداد مورد</button></div></div>
  <div class="cashbig"><div><small>إجمالي المتاح في الخزينة</small><b class="${tot<0?'neg':''}">${f(tot)} ج</b></div>${hand?`<div class="hand"><small>فلوس في إيد المناديب (لسه ماتوردتش)</small><b>${f(hand)} ج</b></div>`:''}</div>
  <div class="stk" style="margin-bottom:16px">${db.boxes.map(b=>{const v=boxBal(b.id);return`<div class="sc ${cashB===b.id?'sel':''}" onclick="cashB=cashB==='${b.id}'?'':'${b.id}';render()"><div class="top"><b>${esc(b.name)}</b><button class="btn sm sec" onclick="event.stopPropagation();boxForm('${b.id}')">✏️</button></div><div class="num ${v<0?'neg':''}" style="font-size:24px">${f(v)} <small>ج</small></div></div>`}).join('')}<div class="sc" style="display:grid;place-items:center;border-style:dashed;color:var(--mut)" onclick="boxForm()">+ خزنة / بنك / محفظة</div></div>
  <div class="panel"><div class="ttl" style="margin-bottom:10px"><b>حركة ${cashB?esc(bName(cashB)):'كل الخزن'} — ${dayName(cashD)}</b><div style="display:flex;gap:6px;align-items:center"><button class="btn sm sec" onclick="cashD=shiftDay(cashD,-1);render()">→</button><input type="date" value="${cashD}" onchange="cashD=this.value||today();render()" style="width:auto;padding:5px 8px"><button class="btn sm sec" onclick="cashD=shiftDay(cashD,1);render()">←</button>${cashD!==today()?`<button class="btn sm sec" onclick="cashD=today();render()">النهارده</button>`:''}</div></div>
   <div class="kp"><div><small>رصيد أول اليوم</small><b>${f(open)}</b></div><div><small>داخل</small><b class="pos">${f(inn)}</b></div><div><small>خارج</small><b class="neg">${f(out)}</b></div><div style="background:var(--soft)"><small>رصيد آخر اليوم</small><b>${f(open+inn-out)}</b></div></div>
   <div class="tw">${Dm.length?`<table><tr><th>البيان</th>${all&&db.boxes.length>1?'<th>الخزنة</th>':''}<th>داخل</th><th>خارج</th><th></th></tr>${Dm.map(m=>`<tr><td>${esc(m.t)}</td>${all&&db.boxes.length>1?`<td>${esc(bName(m.box))}</td>`:''}<td class="pos">${m.a?f(m.a):''}</td><td class="neg">${m.b?f(m.b):''}</td><td>${m.r?actBtns(m.r.k,m.r.id):''}</td></tr>`).join('')}</table>`:'<div class="empty">مفيش حركة في اليوم ده</div>'}</div></div>`;
};
const shiftDay=(d,k)=>{const x=new Date(d);x.setDate(x.getDate()+k);return x.toISOString().slice(0,10)};
function cashForm(type,id){const o=id?byId('cash',id):null;const T={in:'➕ إيداع في الخزنة',out:'➖ سحب من الخزنة',tr:'🔁 تحويل بين الخزن'}[type];
  openM(`<h3>${o?'✏️ تعديل: ':''}${T}</h3><div class="grid"><div><label>${type==='tr'?'من':'الخزنة'}</label><select id="kB">${boxOpts(o?o.boxId:(cashB||db.boxes[0].id))}</select></div>${type==='tr'?`<div><label>إلى</label><select id="kT">${boxOpts(o?o.to:db.boxes[1]?.id)}</select></div>`:''}
  <div><label>المبلغ</label><input type="number" id="kA" value="${o?o.amount:''}"></div><div><label>التاريخ</label><input type="date" id="kD" value="${o?o.date:today()}"></div><div><label>${type==='in'?'مصدر الفلوس / ملاحظة':type==='out'?'السبب (مسحوبات شخصية...)':'ملاحظة'}</label><input id="kN" value="${esc(o?.note)}"></div></div>
  <div class="mfoot">${o?`<button class="btn red" style="margin-left:auto" onclick="delCash('${id}')">🗑️ حذف</button>`:''}<button class="btn sec" onclick="closeM()">إلغاء</button><button class="btn" onclick="saveCash('${type}','${id||''}')">${o?'حفظ التعديل':'حفظ'}</button></div>`)}
function saveCash(type,id){const a=n($('kA').value),b=$('kB').value;if(!a)return alert('اكتب المبلغ');const old=id?byId('cash',id):null;const o={type,boxId:b,amount:a,date:$('kD').value||today(),note:$('kN').value};
  if(type==='tr'){o.to=$('kT').value;if(o.to===b)return alert('اختار خزنتين مختلفين')}
  if(type!=='in'&&!checkBox(b,a,old&&old.boxId===b?old.amount:0))return;if(old)Object.assign(old,markEd(o));else db.cash.push({id:uid(),...o});save();closeM();render();toast(id?'تم التعديل ✅':'تم ✅')}
function delMove(k){const[t,id]=k.split(':');if(!confirm('حذف الحركة دي؟'))return;if(t==='c')db.cash=db.cash.filter(x=>x.id!==id);if(t==='e')db.expenses=db.expenses.filter(x=>x.id!==id);save();render()}
function boxForm(id){const b=id?byId('boxes',id):{};
  openM(`<h3>${id?'تعديل':'إضافة'} خزنة</h3><div class="grid"><div><label>الاسم *</label><input id="xN" value="${esc(b.name)}" placeholder="مثال: بنك مصر / فودافون كاش"></div><div><label>رصيد أول المدة</label><input type="number" id="xO" value="${esc(b.opening)}"></div></div>
  <div class="mfoot">${id&&db.boxes.length>1?`<button class="btn red" style="margin-left:auto" onclick="delBox('${id}')">حذف</button>`:''}<button class="btn sec" onclick="closeM()">إلغاء</button><button class="btn" onclick="saveBox('${id||''}')">حفظ</button></div>`)}
function saveBox(id){const o={name:$('xN').value.trim(),opening:n($('xO').value)};if(!o.name)return alert('اكتب الاسم');if(id)Object.assign(byId('boxes',id),o);else db.boxes.push({id:uid(),...o});save();closeM();render()}
function delBox(id){if(boxMoves(id).length)return alert('الخزنة عليها حركات، لا يمكن حذفها');if(confirm('حذف الخزنة؟')){db.boxes=db.boxes.filter(b=>b.id!==id);if(cashB===id)cashB='';save();closeM();render()}}

V.settings=()=>{
  const s=db.settings,A=isAdmin(),ro=isRO();let old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  $('page').innerHTML=`<div class="ttl"><h2>⚙️ الإعدادات</h2></div>${usersPanel()}
  ${A||(can('settings')&&!ro)?`<div class="panel" style="margin-bottom:14px"><b>بيانات المخزن</b><div class="grid" style="margin-top:10px"><div><label>اسم المخزن</label><input id="sN" value="${esc(s.name)}"></div><div><label>الهاتف</label><input id="sP" value="${esc(s.phone)}"></div><div><label>العنوان</label><input id="sA" value="${esc(s.address)}"></div></div>
  <div class="grid"><div><label>الأقسام (كل قسم في سطر)</label><textarea id="sC" rows="7">${esc(s.cats.join('\n'))}</textarea></div><div><label>الوحدات</label><textarea id="sU" rows="7">${esc(s.units.join('\n'))}</textarea></div></div><button class="btn" onclick="saveSet()">حفظ</button></div>`:''}
  ${A?`<div class="panel"><b>☁️ قاعدة البيانات</b><p class="hint" style="margin:6px 0 10px">البيانات محفوظة أونلاين على Firebase (مشروع <b dir="ltr">${esc(getCfg()?.projectId)}</b>) وبتتزامن على كل الأجهزة. لو النت قطع، الشغل بيتحفظ على الجهاز ويترفع أول ما يرجع.</p>
  <button class="btn" onclick="backup()">⬇️ تنزيل نسخة احتياطية</button> <label class="btn sec" style="display:inline-block;color:var(--txt);margin:0">⬆️ رفع بيانات من نسخة احتياطية / النسخة القديمة<input type="file" accept=".json" style="display:none" onchange="restore(this)"></label>
  ${old&&(old.items||[]).length?` <button class="btn sec" onclick="if(confirm('رفع البيانات القديمة اللي على الجهاز ده؟'))importData(JSON.parse(localStorage.getItem(KEY)))">📤 رفع البيانات القديمة اللي على الجهاز ده</button>`:''}</div>`:''}`;
};
function saveSet(){const L=t=>t.split('\n').map(x=>x.trim()).filter(Boolean);Object.assign(db.settings,{name:$('sN').value.trim()||'مخزن الورقيات',phone:$('sP').value,address:$('sA').value,cats:L($('sC').value),units:L($('sU').value)});save();render();toast('تم الحفظ')}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download=`warqiyat-backup-${today()}.json`;a.click()}
function restore(inp){const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!d.items)throw 0}catch(e){return alert('ملف غير صالح')}if(confirm('رفع البيانات دي؟ السجلات الموجودة مش هتتكرر.'))importData(d)};r.readAsText(inp.files[0]);inp.value=''}

function saveItem(id){const o={name:$('fName').value.trim(),code:$('fCode').value.trim(),cat:$('fCat').value,unit:$('fUnit').value,pcs:n($('fPcs').value),buy:n($('fBuy').value),sell:n($('fSell').value),wh:n($('fWh').value),opening:n($('fOpen').value),min:n($('fMin').value)};

function delItem(id){if(db.sales.some(s=>s.lines.some(l=>l.itemId===id))||db.purchases.some(s=>s.lines.some(l=>l.itemId===id)))return alert('الصنف عليه حركات، لا يمكن حذفه');
  if(!confirm('حذف الصنف؟'))return;db.items=db.items.filter(i=>i.id!==id);save();closeM();render()}
function partyForm(kind,id,presetRep){const c=id?byId(kind,id):{repId:presetRep||myRep()||''};
  openM(`<h3>${id?'تعديل':'إضافة'} ${kind==='customers'?'عميل':'مورد'}</h3><div class="grid"><div><label>الاسم *</label><input id="pN" value="${esc(c.name)}"></div><div><label>الهاتف</label><input id="pPh" value="${esc(c.phone)}"></div><div><label>العنوان</label><input id="pAd" value="${esc(c.address)}"></div><div><label>رصيد أول المدة</label><input type="number" id="pOp" value="${esc(c.opening)}"></div>
  ${kind==='customers'?`<div><label>نوع العميل</label><select id="pRep" ${myRep()?'disabled':''}><option value="">عميل مباشر (الحساب باسمه)</option>${db.reps.map(r=>`<option value="${r.id}" ${r.id===c.repId?'selected':''}>تبع المندوب ${esc(r.name)}</option>`).join('')}</select></div>`:''}</div>
  ${kind==='customers'&&db.reps.length?'<p style="color:var(--mut);font-size:12.5px">💡 عميل المندوب: الفاتورة بتطلع باسمه، والمديونية بتتقيد على حساب المندوب. لو غيرت المندوب، الفواتير القديمة بتفضل على المندوب القديم.</p>':''}
  <div class="mfoot">${id?`<button class="btn red" style="margin-left:auto" onclick="delParty('${kind}','${id}')">حذف</button>`:''}<button class="btn sec" onclick="closeM()">إلغاء</button><button class="btn" onclick="saveParty('${kind}','${id||''}')">حفظ</button></div>`)}
function saveParty(kind,id){const o={name:$('pN').value.trim(),phone:$('pPh').value.trim(),address:$('pAd').value.trim(),opening:n($('pOp').value)};if($('pRep'))o.repId=$('pRep').value;if(!o.name)return alert('اكتب الاسم');
  if(id)Object.assign(byId(kind,id),o);else{id=uid();db[kind].push({id,...o})}save();closeM();if(kind==='customers')openCust(id);else render();toast('تم الحفظ')}
function delParty(kind,id){const inv=kind==='customers'?'sales':'purchases';if(db[inv].some(s=>s.partyId===id)||db.payments.some(p=>p.partyId===id))return alert('عليه فواتير أو مدفوعات، لا يمكن حذفه');
  if(!confirm('حذف؟'))return;db[kind]=db[kind].filter(x=>x.id!==id);if(selC===id)selC=null;save();closeM();render()}
function payForm(type,partyId='',id){const o=id?byId('payments',id):null;const kind=type==='in'?'customers':'suppliers';if(!db[kind].length)return alert('أضف '+(type==='in'?'عميل':'مورد')+' أولاً');
  openM(`<h3>${o?'✏️ تعديل ':''}${type==='in'?(o?'تحصيل':'💵 تحصيل من عميل'):(o?'سداد لمورد':'💸 سداد لمورد')}</h3><div class="grid"><div><label>${type==='in'?'العميل':'المورد'}</label>${type==='in'?`<input type="hidden" id="yP" value="${partyId}">`+cpHTML('yp',partyId,{cash:false,get:()=>$('yP').value,set:id=>{$('yP').value=id;const c=byId('customers',id);$('ypI').value=c?c.name:'';payUpd('in')}}):`<select id="yP" onchange="payUpd('${type}')">${db.suppliers.map(c=>`<option value="${c.id}" ${c.id===partyId?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`}<small id="yB" style="color:var(--mut)"></small></div>
  <div><label>التاريخ</label><input type="date" id="yD" value="${o?o.date:today()}"></div><div><label>المبلغ</label><input type="number" id="yA" value="${o?o.amount:''}"></div><div><label>${type==='in'?'الفلوس استلمها':'اتدفع من'}</label><select id="yW"></select></div><div><label>${type==='in'?'ملاحظة':'ملاحظة / رقم الشيك'}</label><input id="yN" value="${esc(o?.note)}"></div></div>
  <div class="mfoot">${o?`<button class="btn red" style="margin-left:auto" onclick="delPay('${id}')">🗑️ حذف</button>`:''}<button class="btn sec" onclick="closeM()">إلغاء</button><button class="btn" onclick="savePay('${type}','${id||''}')">${o?'حفظ التعديل':'حفظ'}</button></div>`);payUpd(type);if(o)$('yW').value=o.boxId||'rep'}
function payUpd(type){const id=$('yP').value;if(type==='in'&&!id){$('yB').innerHTML='';$('yW').innerHTML=boxOpts();return}
  if(type==='in'){const rid=repOf(id),R=byId('reps',rid);$('yB').innerHTML='عليه: <b>'+f(custBal(id))+'</b>'+(R?` — 🤝 تبع المندوب ${esc(R.name)}`:'');
    $('yW').innerHTML=(R?`<option value="rep">👤 المندوب ${esc(R.name)} (في إيده)</option>`:'')+(myRep()&&!can('cash')?[]:db.boxes).map(b=>`<option value="${b.id}">🏦 ${esc(b.name)}</option>`).join('')}
  else{$('yB').innerHTML='علينا: <b>'+f(supBal(id))+'</b>';$('yW').innerHTML=boxOpts()}}
function savePay(type,id){const a=n($('yA').value);const w=$('yW').value,pid=$('yP').value;if(!pid)return alert(type==='in'?'اختار العميل':'اختار المورد');if(!a)return alert('اكتب المبلغ');
  const old=id?byId('payments',id):null;
  if(type==='out'&&!checkBox(w,a,old&&old.boxId===w?old.amount:0))return;
  const p={type,partyId:pid,date:$('yD').value||today(),amount:a,boxId:w==='rep'?'':w,note:$('yN').value};if(type==='in')p.forRep=old&&old.partyId===pid?(old.forRep||''):repOf(pid);
  if(old)Object.assign(old,markEd(p));else db.payments.push({id:uid(),...p});save();closeM();render();toast(old?'تم التعديل ✅':type==='in'&&!p.boxId?'تم — الفلوس في إيد المندوب لحد ما يورّدها':'تم الحفظ ✅')}
function delPay(id){const p=byId('payments',id);if(p&&confirm(p.type==='in'?`حذف تحصيل ${cName(p.partyId)} (${f(p.amount)} ج)؟`:`حذف سداد ${sName(p.partyId)} (${f(p.amount)} ج)؟`)){db.payments=db.payments.filter(p=>p.id!==id);save();render()}}
function expForm(id){const o=id&&typeof id==='string'?byId('expenses',id):null;const cats=['إيجار','كهرباء','مرتبات','نقل وشحن','عتالة','نثريات','أخرى'];if(o&&!cats.includes(o.cat))cats.push(o.cat);

  <div class="mfoot">${o?`<button class="btn red" style="margin-left:auto" onclick="delExp('${o.id}')">🗑️ حذف</button>`:''}<button class="btn sec" onclick="closeM()">إلغاء</button><button class="btn" onclick="saveExp('${o?o.id:''}')">${o?'حفظ التعديل':'حفظ'}</button></div>`)}
function saveExp(id){const a=n($('eA').value);if(!a)return alert('اكتب المبلغ');const b=$('eB').value,old=id?byId('expenses',id):null;if(!checkBox(b,a,old&&old.boxId===b?old.amount:0))return;
  const o={date:$('eD').value||today(),cat:$('eC').value,amount:a,boxId:b,note:$('eN').value};if(old)Object.assign(old,markEd(o));else db.expenses.push({id:uid(),...o});save();closeM();render();toast(old?'تم التعديل ✅':'تم ✅')}

// فاتورة الشراء (وارد)
let draft;
function invForm(kind,id){
  if(!db.suppliers.length)return alert('أضف مورد أولاً من تبويب الموردين');
  const old=id?db[kind].find(x=>x.id===id):null;
  draft=old?structuredClone(old):{date:today(),partyId:'',lines:[{itemId:'',qty:1,price:0}],discount:0,discType:'ج',paid:0,note:''};
  openM(`<h3>🚚 ${old?'تعديل وارد #'+old.no:'استلام بضاعة من مورد'}</h3><div class="grid"><div><label>التاريخ</label><input type="date" id="iDate" value="${draft.date}"></div><div><label>المورد</label><select id="iParty">${db.suppliers.map(c=>`<option value="${c.id}" ${c.id===draft.partyId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
  <div class="tw"><table class="lines"><tr><th>الصنف</th><th style="width:90px">الكمية</th><th style="width:110px">سعر الشراء</th><th>الإجمالي</th><th></th></tr><tbody id="lnB"></tbody></table></div>
  <button class="btn sec sm" style="margin-top:8px" onclick="draft.lines.push({itemId:'',qty:1,price:0});drawLines()">+ صنف</button>
  <div class="grid" style="margin-top:12px"><div><label>خصم</label><input type="number" id="iDisc" value="${draft.discount}" oninput="calcInv()"></div><div><label>المدفوع للمورد</label><input type="number" id="iPaid" value="${draft.paid}" oninput="calcInv()"></div><div><label>اتدفع من</label><select id="iBox">${boxOpts(draft.boxId||db.boxes[0].id)}</select></div><div><label>ملاحظة</label><input id="iNote" value="${esc(draft.note)}"></div></div><div class="tot" id="iTot"></div>
  <div class="mfoot"><button class="btn sec" onclick="closeM()">إلغاء</button><button class="btn" onclick="saveInv('${id||''}')">حفظ الوارد</button></div>`);drawLines();
}
function drawLines(){$('lnB').innerHTML=draft.lines.map((l,ix)=>`<tr><td><select onchange="const it=byId('items',this.value);draft.lines[${ix}].itemId=this.value;if(it)draft.lines[${ix}].price=it.buy;drawLines()"><option value="">— اختر —</option>${db.items.map(i=>`<option value="${i.id}" ${i.id===l.itemId?'selected':''}>${esc(i.name)}</option>`).join('')}</select></td><td><input type="number" value="${l.qty}" oninput="draft.lines[${ix}].qty=n(this.value);calcInv()"></td><td><input type="number" value="${l.price}" oninput="draft.lines[${ix}].price=n(this.value);calcInv()"></td><td id="lt${ix}"></td><td><button class="btn sm red" onclick="draft.lines.splice(${ix},1);drawLines()">✕</button></td></tr>`).join('');calcInv()}
function calcInv(){draft.discount=n($('iDisc').value);draft.discType='ج';draft.paid=n($('iPaid').value);draft.lines.forEach((l,ix)=>{const c=$('lt'+ix);if(c)c.textContent=f(n(l.qty)*n(l.price))});const t=netTotal(draft);$('iTot').innerHTML=`<div>الإجمالي<br><b>${f(t)}</b></div><div>المتبقي للمورد<br><b class="${t-draft.paid>0?'neg':''}">${f(t-draft.paid)}</b></div>`}
function saveInv(id){calcInv();draft.date=$('iDate').value||today();draft.partyId=$('iParty').value;draft.note=$('iNote').value;draft.boxId=$('iBox').value;
  if(n(draft.paid)&&!checkBox(draft.boxId,n(draft.paid),id&&byId('purchases',id).boxId===draft.boxId?n(byId('purchases',id).paid):0))return;draft.lines=draft.lines.filter(l=>l.itemId&&n(l.qty)>0);
  if(!draft.lines.length)return alert('أضف صنف');draft.lines.forEach(l=>{const it=byId('items',l.itemId);if(it&&n(l.price))it.buy=n(l.price)});
  if(id)Object.assign(byId('purchases',id),draft);else{draft.id=uid();draft.no=nextNo('pur','purchases');db.purchases.push(draft)}save();closeM();sTab='in';render();toast('تم استلام البضاعة ✅')}
function delInv(kind,id){if(!confirm('حذف الفاتورة؟ هيتعدل المخزون والأرصدة تلقائياً'))return;db[kind]=db[kind].filter(x=>x.id!==id);save();render()}
function printInv(kind,id){
  const s=byId(kind,id),p=byId('customers',s.partyId),rs=!!s.repId,prev=p?custBal(p.id)-(netTotal(s)-n(s.paid)):0,w=window.open('','_blank');if(!w)return alert('اسمح بالنوافذ المنبثقة للطباعة');
  w.document.write(`<html dir="rtl"><head><title>فاتورة ${s.no}</title><meta charset="utf-8"><style>${PCSS}</style></head><body>
  <div class="hd"><div><h2 style="margin:0">${esc(db.settings.name)}</h2><div>${esc(db.settings.phone)} ${esc(db.settings.address)}</div></div><div style="text-align:left"><b>فاتورة بيع</b><br>رقم #${s.no}<br>${s.date}</div></div>
  <div class="bx">العميل: <b>${esc(p?.name||'عميل نقدي')}</b> ${p?.phone?' — '+esc(p.phone):''}</div>
  <div class="bx"><table><tr><th>م</th><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${s.lines.map((l,i)=>{const it=byId('items',l.itemId);return`<tr><td>${i+1}</td><td>${esc(it?.name)}</td><td>${f(l.qty)} ${esc(it?.unit)}</td><td>${f(l.price)}</td><td>${f(n(l.qty)*n(l.price))}</td></tr>`}).join('')}</table></div>
  <div class="bx"><div class="r"><span>الإجمالي</span><span>${f(subTotal(s))}</span></div>${discVal(s)?`<div class="r"><span>الخصم</span><span>${f(discVal(s))}</span></div>`:''}<div class="r big"><span>الصافي</span><span>${f(netTotal(s))}</span></div>${rs?'':`<div class="r"><span>المدفوع</span><span>${f(s.paid)}</span></div><div class="r"><span>المتبقي</span><span>${f(netTotal(s)-n(s.paid))}</span></div>`}
  ${p&&!rs?`<div class="sep"></div><div class="r"><span>رصيد سابق</span><span>${f(prev)}</span></div><div class="r big"><span>إجمالي المستحق</span><span>${f(custBal(p.id))}</span></div>`:''}</div>
  ${s.note?`<div class="bx">ملاحظات: ${esc(s.note)}</div>`:''}<p style="text-align:center;color:#888;margin-top:20px">شكراً لتعاملكم معنا</p><script>setTimeout(()=>print(),500)<\/script></body></html>`);w.document.close();
}

boot();
</script>
</body>
</html>
